
spring.profiles.active=default

# Database init, supports MySQL too
database=mysql
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql
spring.sql.init.mode=ALWAYS


# Datasource configuration for MySQL and uncomment corresponding section while using 
# below jdbc url is for testing on docker desktop , uncomment this while testing 
#spring.datasource.url=${MYSQL_URL:jdbc:mysql://host.docker.internal:3306/petclinic}

# below jdbc url is for local vm testing 
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinic}

spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASSWORD:petclinic}

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
